provider "aws" {
  region = "ap-south-1"
}

resource "aws_instance" "PathnexEC2" {
  ami           = "ami-abcd123456557xzcad"
  instance_type = "t3.micro"

  tags = {
    Owner = "PathnexStudent"
  }
}

# Kubernetes
# Deployment with 3 replicas, Image: nginx
apiVersion: apps/v1
kind: deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: Nginx
  template:
    metadata:
      labels:
        app: nginx
    spec: 
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80


