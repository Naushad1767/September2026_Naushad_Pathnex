# Day 21
# Ansible
# Install nginx, Start + enable service
---
- name: Install and start Nginx
  hosts: all
  become: yes

  tasks:
    - name: install nginx
      yum:
        name: nginx
        state: present
        apdate_cache: yes

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes


#Terraform 
