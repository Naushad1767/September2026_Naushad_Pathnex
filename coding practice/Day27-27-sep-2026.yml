# Day 27 — Serverless Scaling with Lambda and DynamoDB
# Ansible — Deploy Serverless Lambda Functions
- name: Deploy Serverless Serverless Lambda Functions
  hosts: localhost
  tasks: 
    - name: Create Lambda Function
      command: aws lambda create-function --function-name pathnex-lambda --runtime nodejs.14.x --role arn:aws:iam::123456789012:role/lambda-role --handler index.handler --zip-file fileb://lambda.zip

#Terraform - create DynamoDB Table for Serverless Application
resource "aws_dynamodb_table" "pathnex_table" {
  name  = "pathnex_table"
  hash_key  = "id"
  billing_mode  = "PAY_PER_REQUEST"
  attribute {
    name  = "id"
    type = "S"
  }
}

# Kubernetes - Deploy Serverless Using Kubeless
apiVersion: Kubeless.io/v1beta1
kind: Function
metadata:
  name: pathnex-lambda
  namespace: default
spec:
  runtime: nodejs14 
  handler: index.handler
  function: |
    module.exports = function(event, context) {
      context.succeed('Hello World');
    };

# Jenkinsfile — Lambda Function Deployment Pipeline
pipeline {
  agent any
  stages {
    stage('Build') {
      steps {
        echo 'Building Lambda function package...'
        sh 'zip -r lambda.zip lambda/'
      }
    }
      stage('Deploy to Lambda') {
        steps {
          script {
            sh 'aws lambda update-function-code --function-name pathnex-lambda --zip-file fileb://lambda.zip'
            }
        }
      }
  }
  }

