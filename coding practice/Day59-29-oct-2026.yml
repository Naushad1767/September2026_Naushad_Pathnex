# Day 29 — Real-World Mini Project
# AWS Provider
provider "aws" {
region = "ap-south-1"
}

# SSH Key Pair
resource "aws_key_pair" "ec2_key" {
  key_name   = "terraform-ec2-key"
  public_key = file(pathexpand("~/.ssh/id_rsa.pub"))
}

# Security Group
resource "aws_security_group" "ec2_sg" {
  name        = "terraform-ec2-sg"
  description = "Allow SSH access to EC2"

  ingress {
    description = "SSH access from trusted IP"
    from_port   = 22
    to_port     = 22
    protocol    = "tcp"

    # Replace with your actual public IP
    cidr_blocks = ["203.0.113.10/32"]
  }

  egress {
    from_port   = 0
    to_port     = 0
    protocol    = "-1"
    cidr_blocks = ["0.0.0.0/0"]
  }

  tags = {
    Name = "terraform-ec2-sg"
  }
}

# EC2 Instance
resource "aws_instance" "PathnexEC2" {
ami = "ami-0d97d7f07b25dd693"
instance_type = "c6i.8xlarge"
key_name = aws_key_pair.pem
vpc_security_group_ids = [aws_security_group.ec2_sg.id]
associate_public_ip_address = true

root_block_device {
  volume_size           = 20
  volume_type           = "gp3"
  encrypted             = true
  delete_on_termination = true
}

tags = {
  Name        = "terraform-ec2"
  Environment = "dev"
}
}

# Additional EBS Volume
resource "aws_ebs_volume" "data" {
  availability_zone = aws_instance.ec2.availability_zone
  size              = 100
  type              = "gp3"
  encrypted         = true

  tags = {
    Name = "terraform-ec2-data"
  }
}

# Attach EBS Volume
resource "aws_volume_attachment" "data_attachment" {
  device_name = "/dev/sdf"
  volume_id   = aws_ebs_volume.data.id
  instance_id = aws_instance.ec2.id
}

# Outputs
output "instance_id" {
  value = aws_instance.ec2.id
}

output "instance_type" {
  value = aws_instance.ec2.instance_type
}

output "public_ip" {
  value = aws_instance.ec2.public_ip
}

output "private_ip" {
  value = aws_instance.ec2.private_ip
}

output "ebs_volume_id" {
  value = aws_ebs_volume.data.id
}


# Ansible
---
- name: Configure Nginx Web Server
  hosts: all
  become: yes

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Deploy welcome page
      copy:
        content: "<h1>Welcome to Pathnex</h1>"
        dest: /var/www/html/index.html

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes


# Kubernetes 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - name: storage
              mountPath: /usr/share/nginx/html
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: my-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080


