# Jenkins

pipeline {
  agent any

  environment {
      INSTITUTE_NAME = "Pathnex"
      TEAM           = "DevOps"
      ENV            = "prod"
      PROJECT        = "Pathnex-Training"
  }

  stages {
      stage('Infrastructure') {
          steps {
              echo "Creating AWS Infrastructure"
              sh '''
                  cd terraform
                  terraform init
                  terraform apply -auto-approve
              '''
          }
      }

      stage('App Deployment') {
          steps {
              echo "Deploying Applications"

              sh '''
                  ansible-playbook -i inventory.ini nginx.yml
                  kubectl apply -f k8s.yaml
              '''
          }
      }

      stage('Monitoring Checks') {
          steps {
              echo "Checking System Health"

              sh '''
                  echo "CPU:"
                  uptime

                  echo "Memory:"
                  free -h

                  echo "Disk:"
                  df -h /

                  echo "IP:"
                  hostname -I

                  echo "Top Process:"
                  ps aux --sort=-%cpu | head -n 2
              '''
          }
      }
  }

    post {
        success {
            echo "Pathnex Pipeline Completed Successfully!"
        }

        failure {
            echo "Pipeline Failed!"
        }
    }
}


# GitLab CI 

stages:
  - infrastructure
  - app-deployment
  - monitoring

variables:
  INSTITUTE_NAME: "Pathnex"
  TEAM: "DevOps"
  ENV: "prod"
  PROJECT: "Pathnex-Training"

# Stage 1: Infrastructure
infrastructure:
  stage: infrastructure
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  script:
    - echo "Creating AWS Infrastructure for $INSTITUTE_NAME"
    - cd terraform
    - terraform init
    - terraform apply -auto-approve

# Stage 2: App Deployment
app-deployment:
  stage: app-deployment
  image: alpine:latest
  before_script:
    - apk add --no-cache ansible kubectl
  script:
    - echo "Deploying $PROJECT"
    - ansible-playbook -i inventory.ini nginx.yml
    - kubectl apply -f k8s.yaml

# Stage 3: Monitoring Checks
monitoring:
  stage: monitoring
  image: alpine:latest
  before_script:
    - apk add --no-cache procps coreutils
  script:
    - echo "CPU:"
    - uptime
    - echo "Memory:"
    - free -h
    - echo "Disk:"
    - df -h /
    - echo "IP:"
    - hostname -i
    - echo "Top Process:"
    - ps aux --sort=-%cpu | head -n 2
    - echo "Pipeline completed for $TEAM in $ENV"
