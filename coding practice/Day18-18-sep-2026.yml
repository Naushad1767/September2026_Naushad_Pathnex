# Day 18 — High Availability, Multi-Region, and Auto-scaling

## Ansible — Configure HAProxy for Load Balancing

```yaml
- name: Setup HAProxy Load Balancer
  hosts: all
  become: yes
  tasks:
    - name: Install HAProxy
      yum:
        name: haproxy
        state: present
    - name: Configure HAProxy
      template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
    - name: Start HAProxy service
      service:
      state: started
      enabled: yes

#Terraform - Multi-Region Auto-scaling Group with ALB

resoource "aws_lb" "pathnex_lb"
name = "pathnex_lb" {
internal  = false
load_balancer_type = "application"
security_groups = [aws_security_group.allow.ssh_http.id]
subnets = [aws_subnet.public.id, aws_subnet.public2.id]
}

resource "aws_autoscaling_group" "pathnex_asg" { 
  desired_capacity = 3
  max_size = 5
  min_size = 2
  vpc_zone_identifier = [aws_subnet.public.id, aws_subnet.public2.id]
  launch_configuration = aws_launch_configuration.pathnex_config.id

}

#Kubernetes — Horizontal Pod Autoscaler with Multiple Replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex-web-app
spec:
  Replicas: 3
  selector:
    matchLabels:
      app: pathnex-web-app
  template:
    metadata:
      labels:
        app: pathnex-web-app
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80

---
apiVersion: Auto-scaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pathnex-web-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pathnex-web-app
  minReplica: 2
  maxReplica: 10
  targetCPUUtilizationPercentage: 80

#Jenkinsfile - Blue-Green Deployment Strategy
pipeline {
  agent any
  stages {
    stage('build') {
      steps {
        echo 'Building Docker Image....'
        docker.build('pathnex-web-app')
      }
    }
    stage('Test') {
      steps {
        echo 'Running tests...'
      }
    }
    stage('Blue-Green Deployment') {
      steps {
        script {
          sh 'kubectl apply -f Kubernetes/blue-deployment.yaml'
          sh 'kubectl apply -f Kubernetes/green-deployment.yaml'
          sh 'kubectl rollout status deployment/blue-deployment'
          sh 'kubectl rollout status deployment/green-deployment'

        }
      }
    }
  }
}

# GitLab CI/CD — Blue-Green Deployment with Kubernetes
stages:
  - build
  - push
  - deploy

build:
  stage: build
  script:
    - docker login -u "$CI_REGISTERY_USER" -p "$CI_REGISTERY_PASSWORD"
    - docker push pathnex-web-app

deploy:
  stage: deploy
  script:
    - kubectl apply -f kubernetes/blue-deployment.yaml
    - kubectl apply -f kubernetes/green-deployment.yaml
    - kubectl rollout status deployment/blue-deployment
    - kubectl rollout status deployment/green-deployment


