# Ansible - Broken Files fixed.

- name: Install Ngnix
  hosts: all
  become: yes

  tasks:
  - name: Install Nginx on Ubuntu
    apt:
      name: nginx
      state: present
    when: ansible_os_family == "Debian"

  - name: Install Nginx on RedHat
    yum:
      name: nginx
      state: present
    when: ansible_os_family == "RedHat"


