# Kubernetes — Broken Files fixed.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixed-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fixed-app
  template:
    metadata:
      labels:
        app: fixed-app
    spec:
      containers:
        - name: app
          image: nginx


# Secrets & Credentials
# Jenkins Pipeline — Using Credentials
pipeline {
  agent any
  environmet {
    INSTITUTE_NAME = "Pathnex"
  }
  stages {
    stage('Checkout') {
      steps {
        git url: 'https://github.com/Pathnex/sample-java-app.git'
      }
    }
    stage('Use Secret') {
      steps {
        withCredentials([string(credentialsId: 'PATHNEX_API_KEY', variable: 'API_KEY')]) {
                    sh 'echo "Using secret $API_KEY for $INSTITUTE_NAME"'
         }
      }
    }
  }
}


# GitLab CI — Using CI/CD Variables
