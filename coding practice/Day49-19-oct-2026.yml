# Day 19 — Git Deploy, RDS Skeleton, Rolling Strategy, Ping Check
# Ansible — Deploy App Using Git
- name: Deploy app from Git for Pathnex
  hosts: all
  become: yes

  tasks:
    - name: Install git
      yum:
        name: git
        state: present

    - name: Clone repository
      git:
        repo: "https://github.com/pathnex/app.git"
        dest: "/opt/pathnex-app"

# Terraform - RDS Skeleton (MySQL)

resource "aws_db_instance" "PathnexRDS" {
  allocated = 20
  engine  = "mysql"
  instance_class  = "dv.t3.mirco"
  username  = "admin"
  password = "pathnex123"
  skip_final_snapshot = true

  }

  # Kubernetes — Deployment Rolling Update (Detailed)
  apiVersion: apps/v1
  kind: Deployment
  metadata: 
    name: pathnex-rollout
  spec:
    replicas: 3
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 2
        maxUnavailable: 1
    selector:
      matchLabels:
        app: rollout
    template:
      metadata:
        labels:
          app: rollout
      spec:
        containers:
          - name: app
            image: nginx


# Shell Script — Check Internet Connectivity
#!/bin/bash

ping -c 2 google.com &> /dev/null

if [ $? -eq 0 ]; then
  echo "Internet is available"
else
  echo "No internet connection"
fi

# Jenkins Pipeline — Manual Approval

pipeline {
  agent any
    environmet {
      INSTITUE_NAME = "Pathnex"
    }
    stages {
      stage('Deploy') {
        steps {
          input message: "Approve deployment for $INSTITUE_NAME"
          sh 'echo "Deployment approved and executed!"'
        }
      }
    }
}

# GitLab CI - Manual Approval Job
stages:
  - deploy

variables:
  INSTITUE_NAME: "Pathnex"

deploy:
  stage: deploy
  image: alpine:latest
  scipt:
    - echo "Ready to deploy $INSTITUE_NAME"
when: manual