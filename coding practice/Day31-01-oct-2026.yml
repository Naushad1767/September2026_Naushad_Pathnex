# Day 01 — Basics
## Ansible Task — Install Nginx on Pathnex Server

---
- name: Install Nginx on Pathnex Server
  hosts: all
  become: yes

  tasks:
    - name: Install Nginx
      yum:
        name: nginx 
        state: present 

## Terraform Task — Create EC2 (c5.xlarge)
provider "aws" {
  region = "us-east-1"
}

resource "aws_instance" "PathnexEC2" {
  ami = "ami-ancd01231abcd"
  instance_type = "c5.xlarge"

  tags = {
    Name = "PathnexEC2"
  }
}

## Kubernetes Task — Create Nginx Pod
apiVersion: v1
kind: Pod 
metadat: 
  name: pathnex-pod
spec:
  containers:
    - name: web
      image: nginx:latest
      ports:
        - containerPort: 80

# Shell Script - Print Date & Hostname
#!/bin/bash
echo "Date: $(date)"
echo "Hostname: $(hostname)"

# Git Integration
##  Jenkins Pipeline — Checkout Git
# You will learn how to **checkout a Git repository** and list files.
Pipeline {
  agent any
    stages {
      stage('Checkout') {
        steps {
          git branch: 'main', url: 'https://github.com/Pathnex/sample-java-app.git'
        }
      }
      stage('List Files') {
        steps {
          sh 'ls -la'
        }
      }
    }
}

# GitLab CI - checkout Git
# You will learn how to **checkout a Git repository in GitLab CI**.

stages:
  - checkout

git-checkout:
  stage: checkout
  script:
    - git clone https://github.com/Pathnex/sample-java-app.git
    - cd sample-java-app 
    - ls -la