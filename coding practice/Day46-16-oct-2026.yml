
#!/bin/bash

ROLE_DIR="roles/pathnex"

# Create role directories
mkdir -p "$ROLE_DIR"/{tasks,handlers,templates,vars}

# Create tasks/main.yml
cat > "$ROLE_DIR/tasks/main.yml" <<'EOF'
---
- name: Install Nginx
  ansible.builtin.package:
    name: "{{ nginx_package }}"
    state: present
EOF

# Create handlers/main.yml
cat > "$ROLE_DIR/handlers/main.yml" <<'EOF'
---
- name: Restart Nginx
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: restarted
EOF

# Create vars/main.yml
cat > "$ROLE_DIR/vars/main.yml" <<'EOF'
---
nginx_package: nginx
nginx_service: nginx
EOF

echo "Ansible role structure created successfully!"


# Terraform — DynamoDB Table

resource "aws_dynamodb_table" "PathnexTable" {
  name           = "PathnexTrainingTable"
  billing_mode   = "PAY_PER_REQUEST"
  hash_key       = "ID"

  attribute {
    name = "ID"
    type = "S"
  }

  tags = {
    Name = "Pathnex-DDB"
  }
}


# Kubernetes — StatefulSet

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pathnex-db
spec:
  serviceName: "pathnex"
  replicas: 2
  selector:
    matchLabels:
      app: pathnex-db
  template:
    metadata:
      labels:
        app: pathnex-db
    spec:
      containers:
        - name: db
          image: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "Pathnex123"


# Shell Script — Check Service Running
#!/bin/bash

SERVICE="sshd"

if systemctl is-active --quiet $SERVICE; then
  echo "$SERVICE is running"
else
  echo "$SERVICE is NOT running"
fi


# Artifacts Promotion
# Jenkins Pipeline — Promote Artifacts

pipeline {
    agent any
    environment {
        INSTITUTE_NAME = "Pathnex"
    }
    stages {
        stage('Build') {
            steps {
                sh 'mvn clean package'
            }
        }
        stage('Promote') {
            steps {
                input message: "Promote artifacts to staging?"
                sh 'echo "Promoting artifacts for $INSTITUTE_NAME"'
            }
        }
    }
}


# GitLab CI — Artifacts Promotion
stages:
  - build
  - promote

build:
  stage: build
  image: maven:3.8.1-jdk-17
  script:
    - mvn clean package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

promote:
  stage: promote
  image: alpine:latest
  script:
    - echo "Promoting artifacts for Pathnex"
  when: manual