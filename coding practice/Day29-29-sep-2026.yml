# Day 29 — Final Project Setup and Configuration

## Ansible — Complete Deployment Setup

```yaml
- name: Complete Deployment Setup
  host: all
  become: yes
  tasks:
    - name: Deployment Nginx, MySQL, and Redis with Docker
      command: docker-compose -f /path/to/docker-compose.yml up -d

# Terraform - Provisioning Multi-Tier Application with VPC and Security
resource "aws_vpc" "pathnw_vpc" {
  cidr_block = "10.0.0.0/16"
  } 

resource "aws_instance" "pathnex_app" {
  ami = "ami-0abcd12345abd12"
  instance_type = "t2.medium"
  subnet_id = aws_subnet.pathnex_subnet.id
  security_groups = [aws_security_group.pathnec_sg.name]
  }

# Kubernetes - Deploy full Application Stack
apiVersion: apps/v1
kind: Deployment 
metadata:
  name: pathnex-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pathnex-app
  template: 
    metadata:
      labels: 
        app: pathnex-app 
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80

---
apiVersion: apps/v1
kind: Service
metadata: 
  name: pathnex-service
spec: 
  selector:
    app: pathnex-app
  ports:  
    - port: 80
      targetPort: 80

# Docker
#Docker Security & Cleanup
FROM nginx 
RUN useradd pathnexuser
USER pathnexuser

# Commands
docker container prune
docker image prune
docker volume prune
docker network prune
docker system prune -a 

#Finale Docker Project
version: '3'
services:
  frontend:
    image: nginx 
    container_name: pathnex-frontend
    ports:
      - "80:80"
  backend:
    build: ./backend
    container_name: pathnex-backend
    ports:
      - "5000:5000"
  database:
    image: mysql:8
    container_name: pathnex-mysql
    environment:
      MySQL_ROOT_PASSWORD: root
